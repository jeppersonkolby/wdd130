<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Contact Us | Canyon Rafting
    </title>
    <meta name="description" content="Contact Canyon Rafting in Provo, Utah, for questions, rafting trip reservations, and information about our whitewater rafting adventures.">
    <meta name="author" content="Kolby Jepperson">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Canyon Rafting company logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main class="contact-page">
        <section class="company-info">
            <h1>Contact Canyon Rafting</h1>
            <p>123W 456S, Provo, UT 84601</p>
            <p>123-456-7890</p>
            <p>Canyon.rafting@gmail.com</p>
        </section>
        <section class="contact-map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d97434.47274501248!2d-111.72130935601359!3d40.257369837120564!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874d9271930bf1bf%3A0x1d90f12600b556ef!2sProvo%2C%20UT!5e0!3m2!1sen!2sus!4v1795554622025!5m2!1sen!2sus"></iframe>
        </section>
        <section class="contact-form">
            <h2>Contact Us</h2>
            <form>
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
                <label>General Inquiry
                    <input type="radio" id="general" name="purpose" value="general"></label>
                <label>Reservation Question
                    <input type="radio" id="reservation" name="purpose" value="reservation"></label>
                <label>Website Suggestion
                    <input type="radio" id="suggestion" name="purpose" value="suggestion"></label>
                <label for="message">Your Message</label>
                <textarea name="message" id="message" rows="5" cols="40"></textarea>
                <label>Please subscribe me to the monthly newsletter
                    <input type="checkbox" name="newsletter" id="newsletter"></label>
                <button type="submit">Send Message</button>
            </form>
        </section>
        <section class="team">
            <h2>Meet Our Team</h2>
            <figure><img src="images/employee1.jpg" alt="our number one employee">
                <figcaption>Alexa - Rafting Guide</figcaption>
            </figure>
            <figure><img src="images/employee2.jpg" alt="our number two employee">
                <figcaption>John - Rafting Guide</figcaption>
            </figure>
            <figure><img src="images/employee3.jpg" alt="our number three employee">
                <figcaption>Bill - Rafting Guide</figcaption>
            </figure>
        </section>

    </main>
    <footer>
        <p>©️, 2026, Canyon Rafting, Kolby Jepperson.</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook-logopng.webp" alt="facebook logo"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.png" alt="instagram logo"></a>
            <a href="https://x.com/"><img src="images/x-logo.png" alt="X logo"></a>

        </nav>
    </footer>
</body>

</html>
